# O GitHub desliga tarefas agendadas de repositórios sem nenhum commit há 60 dias.
# Este fluxo faz um commit vazio uma vez por mês, só se o último tiver mais de 40 dias.
name: Manter agendamento ativo

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter agendamento ativo"
            git push
          fi
