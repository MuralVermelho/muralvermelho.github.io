name: Atualizar e publicar

on:
  schedule:
    - cron: "7 * * * *"   # de hora em hora, no minuto 7
  push:
    branches: [main]
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Coletar feeds
        run: npm run fetch
        env:
          # reaproveita o histórico já publicado (os feeds só trazem ~10 itens)
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/data/items.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
